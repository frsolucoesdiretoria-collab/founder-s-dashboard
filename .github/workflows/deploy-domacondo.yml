name: Deploy Doma Condo Site

on:
  push:
    branches:
      - main
      - feature/v5-3-6-replica
  workflow_dispatch:

jobs:
  deploy-doma-condo:
    name: Deploy domacondo.agendainteligentes.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Create webroot on VM
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo mkdir -p /var/www/domacondo.agendainteligentes.com && sudo chown -R ${VPS_USER}:${VPS_USER} /var/www/domacondo.agendainteligentes.com"

      - name: Deploy site files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -e
          rsync -avz --delete \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${VPS_PORT}" \
            "Desktop/Tech-2/Axis Antivacância/Doma Condo/site/public/" \
            "${VPS_USER}@${VPS_HOST}:/var/www/domacondo.agendainteligentes.com/"

      - name: Configure nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          NGINX_CONF="Desktop/Tech-2/Axis Antivacância/Doma Condo/infra/nginx/domacondo.agendainteligentes.com.conf"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p ${VPS_PORT}" \
            "${NGINX_CONF}" \
            "${VPS_USER}@${VPS_HOST}:/tmp/domacondo.conf"

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo cp /tmp/domacondo.conf /etc/nginx/sites-available/domacondo.agendainteligentes.com && sudo ln -sf /etc/nginx/sites-available/domacondo.agendainteligentes.com /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx && echo nginx_ok"

      - name: Verify deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          COUNT=$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "ls /var/www/domacondo.agendainteligentes.com/*.html 2>/dev/null | wc -l")
          echo "Paginas HTML no servidor: ${COUNT}"
          if [ "${COUNT}" -ge "20" ]; then
            echo "Deploy OK - ${COUNT} paginas"
          else
            echo "AVISO: apenas ${COUNT} paginas encontradas"
          fi
