<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AntecipaMed - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed": "#00174b",
                    "surface": "#f7f9fb",
                    "surface-container": "#eceef0",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#0053db",
                    "primary-fixed-dim": "#b4c5ff",
                    "surface-dim": "#d8dadc",
                    "inverse-primary": "#b4c5ff",
                    "inverse-surface": "#2d3133",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#006c49",
                    "on-primary-container": "#eeefff",
                    "primary-container": "#2563eb",
                    "tertiary-container": "#bc4800",
                    "on-surface": "#191c1e",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "secondary-fixed": "#6ffbbe",
                    "on-surface-variant": "#434655",
                    "on-primary-fixed-variant": "#003ea8",
                    "tertiary-fixed-dim": "#ffb596",
                    "secondary-container": "#6cf8bb",
                    "primary": "#004ac6",
                    "outline-variant": "#c3c6d7",
                    "on-tertiary-container": "#ffede6",
                    "on-secondary-container": "#00714d",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#4edea3",
                    "surface-bright": "#f7f9fb",
                    "on-secondary-fixed": "#002113",
                    "background": "#f7f9fb",
                    "inverse-on-surface": "#eff1f3",
                    "surface-variant": "#e0e3e5",
                    "primary-fixed": "#dbe1ff",
                    "surface-container-low": "#f2f4f6",
                    "on-secondary-fixed-variant": "#005236",
                    "tertiary": "#943700",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#ffdbcd",
                    "on-primary": "#ffffff",
                    "on-background": "#191c1e",
                    "outline": "#737686",
                    "on-tertiary-fixed": "#360f00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- Status Bar Simulation -->
<div class="w-full max-w-md flex justify-between items-center px-6 py-3 bg-surface">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-[18px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<!-- Top App Bar (From Shared Components Protocol) -->
<header class="flex items-center px-4 h-16 w-full max-w-md bg-[#f7f9fb]">
<button class="p-2 transition-all duration-200 active:scale-95 hover:bg-slate-200/50 rounded-full">
<span class="material-symbols-outlined text-[#004ac6]">arrow_back</span>
</button>
</header>
<!-- Content Canvas -->
<main class="w-full max-w-md px-8 flex flex-col items-center">
<!-- Brand Identity / Icon Section -->
<div class="mt-8 mb-10 flex flex-col items-center">
<div class="w-20 h-20 bg-primary-container rounded-[2rem] flex items-center justify-center shadow-[0px_12px_32px_rgba(37,99,235,0.15)] relative overflow-hidden">
<!-- Subtle internal gradient for "soul" as per Glass & Gradient rule -->
<div class="absolute inset-0 bg-gradient-to-br from-primary to-primary-container opacity-90"></div>
<span class="material-symbols-outlined text-white text-5xl relative z-10" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="mt-8 text-3xl font-extrabold tracking-tight text-on-surface text-center leading-tight">
                Bem-vindo de volta
            </h1>
<p class="mt-2 text-slate-500 font-body text-center text-sm">
                Acesse sua conta para gerenciar suas antecipações.
            </p>
</div>
<!-- Form Section -->
<form class="w-full space-y-6">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-slate-500 ml-1 uppercase tracking-wider" for="cpf">CPF</label>
<div class="relative group">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-high border-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-slate-400 font-medium" id="cpf" placeholder="000.000.000-00" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-slate-500 ml-1 uppercase tracking-wider" for="password">Senha</label>
<div class="relative group">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-high border-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-slate-400 font-medium" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
</div>
<div class="flex justify-end">
<a class="text-sm font-semibold text-primary hover:text-primary-container transition-colors mt-1" href="#">Esqueci minha senha</a>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full h-14 bg-primary text-white font-headline font-bold text-lg rounded-full shadow-[0px_12px_32px_rgba(0,74,198,0.2)] hover:bg-primary-container transition-all active:scale-[0.98]" type="submit">
                    Entrar
                </button>
</div>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
<span class="text-xs font-bold text-slate-400 uppercase tracking-widest">ou</span>
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
</div>
<!-- Secondary Action -->
<button class="w-full h-14 border-2 border-primary/20 text-primary font-headline font-bold text-base rounded-full hover:bg-primary/5 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">admin_panel_settings</span>
            Entrar como Admin
        </button>
<!-- Spacer for mobile view -->
<div class="flex-grow min-h-[4rem]"></div>
<!-- Footer Link -->
<div class="pb-10 w-full text-center">
<p class="text-slate-500 text-sm">
                Ainda não tem uma conta? 
                <a class="text-secondary font-bold hover:underline decoration-2 underline-offset-4" href="#">Criar conta</a>
</p>
</div>
</main>
<!-- Visual Anchor: Decorative Gradient Blob (Subtle Architectural Element) -->
<div class="fixed -bottom-32 -left-32 w-80 h-80 bg-secondary/5 rounded-full blur-[80px] pointer-events-none"></div>
<div class="fixed -top-32 -right-32 w-80 h-80 bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
</body></html>
