<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f7f9fb",
                    "on-primary-fixed": "#00174b",
                    "on-primary-container": "#eeefff",
                    "on-tertiary-fixed": "#360f00",
                    "on-secondary-fixed": "#002113",
                    "secondary": "#006c49",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f2f4f6",
                    "secondary-container": "#6cf8bb",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "secondary-fixed-dim": "#4edea3",
                    "tertiary-container": "#bc4800",
                    "outline": "#737686",
                    "error-container": "#ffdad6",
                    "surface-tint": "#0053db",
                    "tertiary-fixed": "#ffdbcd",
                    "on-secondary-fixed-variant": "#005236",
                    "surface-bright": "#f7f9fb",
                    "surface-variant": "#e0e3e5",
                    "primary-fixed": "#dbe1ff",
                    "inverse-primary": "#b4c5ff",
                    "surface-dim": "#d8dadc",
                    "background": "#f7f9fb",
                    "on-primary": "#ffffff",
                    "primary": "#004ac6",
                    "primary-container": "#2563eb",
                    "surface-container-highest": "#e0e3e5",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c3c6d7",
                    "secondary-fixed": "#6ffbbe",
                    "on-background": "#191c1e",
                    "tertiary-fixed-dim": "#ffb596",
                    "tertiary": "#943700",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#434655",
                    "on-surface": "#191c1e",
                    "inverse-surface": "#2d3133",
                    "on-tertiary-container": "#ffede6",
                    "on-secondary-container": "#00714d",
                    "primary-fixed-dim": "#b4c5ff",
                    "inverse-on-surface": "#eff1f3",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container": "#eceef0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            box-shadow: none !important;
            border-bottom: 2px solid #2563eb !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full bg-[#f7f9fb] dark:bg-slate-900 sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="hover:bg-slate-200/50 dark:hover:bg-slate-800 transition-colors rounded-full p-2 active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-[#004ac6] dark:text-blue-400">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-extrabold text-xl tracking-tight text-[#004ac6] dark:text-blue-400">Registration</h1>
</div>
<div class="hidden md:flex gap-6">
<span class="text-[#004ac6] dark:text-blue-400 font-bold">Personal</span>
<span class="text-slate-500 dark:text-slate-400">Professional</span>
<span class="text-slate-500 dark:text-slate-400">Security</span>
</div>
</div>
</header>
<main class="w-full max-w-xl px-6 pt-8 pb-32">
<!-- Progress Section -->
<div class="mb-10">
<div class="flex justify-between items-end mb-4">
<h2 class="font-headline font-extrabold text-2xl text-on-surface">Criar conta</h2>
<span class="font-headline font-bold text-primary text-sm">1/3</span>
</div>
<!-- Progress Bar -->
<div class="flex gap-2 h-1.5 w-full">
<div class="flex-1 bg-primary-container rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
</div>
<!-- Step Labels -->
<div class="flex justify-between mt-4">
<span class="font-label text-[11px] font-bold uppercase tracking-wider text-primary">Dados pessoais</span>
<span class="font-label text-[11px] font-bold uppercase tracking-wider text-outline">Contato</span>
<span class="font-label text-[11px] font-bold uppercase tracking-wider text-outline">Banco</span>
</div>
</div>
<!-- Step 1 Content Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0px_12px_32px_rgba(25,28,30,0.04)] relative z-10">
<h3 class="font-headline font-bold text-lg mb-8">Dados pessoais</h3>
<form class="space-y-6">
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline-variant uppercase tracking-wide">Nome completo</label>
<input class="w-full bg-surface-container-low border-none border-b-2 border-transparent rounded-t-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:ring-0 transition-all" placeholder="Dr. João Silva" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline-variant uppercase tracking-wide">CPF</label>
<input class="w-full bg-surface-container-low border-none border-b-2 border-transparent rounded-t-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:ring-0 transition-all" placeholder="000.000.000-00" type="text"/>
</div>
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline-variant uppercase tracking-wide">CRM</label>
<input class="w-full bg-surface-container-low border-none border-b-2 border-transparent rounded-t-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:ring-0 transition-all" placeholder="CRM/SP 123.456" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline-variant uppercase tracking-wide">Especialidade</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none border-b-2 border-transparent rounded-t-lg px-4 py-3 text-on-surface appearance-none focus:ring-0 transition-all">
<option disabled="" selected="">Selecione sua área</option>
<option>Cardiologia</option>
<option>Pediatria</option>
<option>Neurologia</option>
<option>Ortopedia</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline font-bold py-4 rounded-full flex items-center justify-center gap-2 hover:bg-primary-container transition-all active:scale-[0.98] mt-4" type="button">
                    Próximo
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
<!-- Step 2 Preview (Partially Visible/Grayed Out) -->
<div class="mt-8 opacity-40 select-none pointer-events-none">
<div class="bg-surface-container-low rounded-xl p-8 border border-outline-variant/10">
<h3 class="font-headline font-bold text-lg mb-6 text-outline">Contato</h3>
<div class="space-y-4">
<div class="h-12 bg-surface-container-high rounded-lg w-full"></div>
<div class="h-12 bg-surface-container-high rounded-lg w-3/4"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-t-[24px] shadow-[0px_-12px_32px_rgba(25,28,30,0.04)] border-t border-slate-100 dark:border-slate-800">
<div class="flex flex-col items-center justify-center bg-[#2563eb] text-white rounded-full p-3 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-[10px] uppercase tracking-widest mt-1">Personal</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:text-[#004ac6] dark:hover:text-blue-300">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-[10px] uppercase tracking-widest mt-1">Professional</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:text-[#004ac6] dark:hover:text-blue-300">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-[10px] uppercase tracking-widest mt-1">Security</span>
</div>
</nav>
</body></html>
