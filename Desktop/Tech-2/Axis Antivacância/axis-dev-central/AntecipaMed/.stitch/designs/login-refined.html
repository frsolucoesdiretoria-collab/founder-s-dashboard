<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AntecipaMed - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#6ffbbe",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-highest": "#e0e3e5",
                        "primary-container": "#2563eb",
                        "inverse-surface": "#2d3133",
                        "on-surface-variant": "#434655",
                        "primary": "#004ac6",
                        "secondary-container": "#6cf8bb",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "tertiary": "#943700",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-tint": "#0053db",
                        "surface-dim": "#d8dadc",
                        "secondary": "#006c49",
                        "outline": "#737686",
                        "on-tertiary-container": "#ffede6",
                        "on-background": "#191c1e",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#360f00",
                        "surface": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#b4c5ff",
                        "background": "#f7f9fb",
                        "secondary-fixed-dim": "#4edea3",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed": "#002113",
                        "tertiary-container": "#bc4800",
                        "on-secondary-container": "#00714d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen flex flex-col items-center justify-start text-on-surface">
<!-- Screen Container (Simulated Mobile View) -->
<div class="w-full max-w-md min-h-screen flex flex-col bg-surface overflow-hidden">
<!-- Status Bar Mockup -->
<div class="flex justify-between items-center px-6 py-3 text-on-surface font-semibold text-sm">
<span>10:21</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-sm">signal_cellular_alt</span>
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="material-symbols-outlined text-sm">battery_full</span>
</div>
</div>
<!-- TopAppBar (Shared Component Logic) -->
<header class="flex items-center w-full px-6 py-4 bg-[#f7f9fb] dark:bg-slate-950">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200/50 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#004ac6] dark:text-blue-400">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-8 pt-6 pb-12">
<!-- Logo & Greeting Section -->
<div class="flex flex-col items-center text-center mb-10">
<div class="w-20 h-20 mb-6 rounded-[24px] bg-gradient-to-br from-[#2563eb] to-[#1D4ED8] flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">search_activity</span>
</div>
<h1 class="text-3xl font-extrabold text-on-surface mb-2 tracking-tight">Bem-vindo de volta</h1>
<p class="text-on-surface-variant font-medium">Entre na sua conta AntecipaMed</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- CPF Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface ml-1">CPF</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-high border-none text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" inputmode="numeric" placeholder="000.000.000-00" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface ml-1">Senha</label>
<div class="relative">
<input class="w-full h-14 px-5 pr-14 rounded-xl bg-surface-container-high border-none text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-primary text-xs font-bold hover:underline" href="#">Esqueci minha senha</a>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary font-bold text-lg rounded-full shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                    Entrar
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="px-4 text-xs font-bold text-outline uppercase tracking-widest">OU</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Secondary Action -->
<button class="w-full h-14 border-2 border-outline-variant bg-transparent text-on-surface-variant font-bold rounded-full hover:bg-surface-container transition-colors flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-xl">admin_panel_settings</span>
<span>Entrar como Admin</span>
</button>
<!-- Sign Up Link -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant font-medium">
                    Não tem conta? 
                    <a class="text-primary font-extrabold ml-1 hover:underline" href="#">Criar conta</a>
</p>
</div>
</main>
<!-- Bottom Navigation Shell (Suppressed as per Transactional Rule) -->
<!-- Suppression: The BottomNavBar is excluded because this is a login/transactional screen focused on a single task. -->
</div>
<!-- Decorative Image (Subtle Background Detail for Web View) -->
<div class="fixed inset-0 -z-10 hidden md:block">
<div class="absolute inset-0 bg-[#f7f9fb]" data-alt="smooth gradient flowing from soft white to a very light blue medical aesthetic with subtle grain texture"></div>
<div class="absolute top-1/4 right-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 left-1/4 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
