<div class="flex items-center gap-3">
<div class="h-2 w-2 rounded-full bg-secondary-container"></div>
<p class="text-xs font-medium uppercase tracking-widest text-secondary-fixed">Status: Operacional</p>
</div>
</div>
</div>
<div class="text-center space-y-4">
<h2 class="font-headline text-4xl font-bold tracking-tight text-white leading-tight">
                    Seu plantão,<br/>seu dinheiro. Agora.

<p class="text-surface-variant font-light text-lg leading-relaxed max-w-xs mx-auto">

                </p>
</div>
</section>
