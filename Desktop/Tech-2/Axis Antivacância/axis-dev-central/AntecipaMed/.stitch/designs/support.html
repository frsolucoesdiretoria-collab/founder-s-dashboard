<body class="text-on-surface">
<!-- TopAppBar -->
<nav class="fixed top-0 left-0 w-full z-50 flex items-center px-4 h-16 bg-slate-50 dark:bg-slate-900 transition-all duration-200 active:scale-95 shadow-none">
<div class="flex items-center gap-4 w-full">
<button class="p-2 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 text-blue-700 dark:text-blue-400">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-extrabold text-lg text-blue-700 dark:text-blue-400">Suporte</h1>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="pt-20 pb-40 px-4 max-w-2xl mx-auto flex flex-col gap-6">
<!-- Support Header Status -->
<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-xl">
<div class="relative">
<img class="w-12 h-12 rounded-full object-cover" data-alt="professional support agent portrait with a friendly smile, clean medical tech environment background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZHI8282VaExUjk9Rh-XlNfRfedfX4J2NOlUkMQCkbue3HE3KzHceLOZ4djdUcUtI6dIXfUwNRt0UD5oQL5XtOE3Hmv2mCzEKy7Rg46Pvh0uOA0Xd2D0-1658Dv8XLZITXgVaMu4fN1oJ4sGloZwUEx6gTXymft2xiJuV8wNoAhJzQ3A1KTQ_evWrvKTlJCFXzxnG7fHtxmRTnsd6liUyGQY3857aWoVwIweiuHVG2KmlqRmF-bVfFJEujfkh3YOy0ouxuQgVbnLI"/>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-secondary border-2 border-surface-container-low rounded-full"></div>
</div>
<div>
<p class="font-headline font-bold text-sm text-on-surface">Equipe AntecipaMed</p>
<p class="font-label text-xs text-on-surface-variant">Online agora</p>
</div>
</div>
<!-- Chat History -->
<div class="flex flex-col gap-4">
<!-- Agent Message -->
<div class="flex flex-col items-start max-w-[85%]">
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded-2xl rounded-tl-none p-4 shadow-[0px_4px_12px_rgba(25,28,30,0.02)]">
<p class="font-body text-on-surface-variant leading-relaxed">Olá, Dr. Ricardo! Como posso ajudar você hoje?</p>
</div>
<span class="font-label text-[10px] text-outline mt-1 ml-1">09:41</span>
</div>
<!-- User Message -->
<div class="flex flex-col items-end max-w-[85%] self-end">
<div class="bg-primary-container text-on-primary rounded-2xl rounded-tr-none p-4 shadow-[0px_8px_16px_rgba(37,99,235,0.1)]">
<p class="font-body leading-relaxed">Tenho uma dúvida sobre o status da minha antecipação.</p>
</div>
<span class="font-label text-[10px] text-outline mt-1 mr-1 text-right">09:42</span>
</div>
<!-- Agent Message -->
<div class="flex flex-col items-start max-w-[85%]">
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded-2xl rounded-tl-none p-4 shadow-[0px_4px_12px_rgba(25,28,30,0.02)]">
<p class="font-body text-on-surface-variant leading-relaxed">Claro! Posso verificar isso para você. Sobre qual plantão você deseja falar?</p>
</div>
<span class="font-label text-[10px] text-outline mt-1 ml-1">09:42</span>
</div>
</div>
</main>
<!-- Bottom Navigation & Input Area -->
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col bg-white/80 backdrop-blur-xl rounded-t-3xl shadow-[0px_-12px_32px_rgba(25,28,30,0.04)]">
<!-- Quick Reply Chips -->
<div class="flex gap-2 overflow-x-auto px-6 py-4 no-scrollbar border-b border-surface-container">
<button class="whitespace-nowrap px-4 py-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-sm rounded-full transition-all">Status da antecipação</button>
<button class="whitespace-nowrap px-4 py-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-sm rounded-full transition-all">Documentos pendentes</button>
<button class="whitespace-nowrap px-4 py-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-sm rounded-full transition-all">Dúvidas sobre taxas</button>
<button class="whitespace-nowrap px-4 py-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-sm rounded-full transition-all">Falar com atendente</button>
<button class="whitespace-nowrap px-4 py-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-sm rounded-full transition-all">Ver FAQ</button>
</div>
<!-- Text Input Area -->
<div class="flex items-center gap-3 px-6 py-4 pb-8">
<div class="flex-1 bg-surface-container-high rounded-full px-5 h-12 flex items-center">
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-body placeholder:text-outline" placeholder="Escreva sua mensagem..." type="text"/>
</div>
<button class="w-12 h-12 bg-primary-container text-white rounded-full flex items-center justify-center transition-transform active:scale-90 shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<!-- Bottom Navigation Hub (Icons Only) - Hidden on support screen as per focal task priority -->
<!-- But maintained for shell integrity if user navigates back -->
<div class="hidden md:flex fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-xl rounded-full px-8 py-4 gap-8 shadow-2xl items-center border border-white/20">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 transition-transform duration-300 active:scale-90 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 transition-transform duration-300 active:scale-90 cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="flex flex-col items-center justify-center bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 rounded-2xl p-3 transition-transform duration-300 active:scale-90 cursor-pointer">
<span class="material-symbols-outlined" data-icon="chat_bubble" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 transition-transform duration-300 active:scale-90 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</div>
