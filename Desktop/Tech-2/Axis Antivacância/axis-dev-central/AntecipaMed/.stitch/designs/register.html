<header class="fixed top-0 w-full z-50 flex items-center px-6 h-16 w-full bg-slate-50 dark:bg-slate-950">
<div class="flex items-center gap-4 transition-transform duration-200 active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-blue-700 dark:text-blue-400">arrow_back</span>
<h1 class="text-blue-700 dark:text-blue-400 font-plus-jakarta text-lg font-extrabold">Criar conta</h1>
</div>
</header>
<main class="w-full max-w-md px-6 pt-24 pb-32 flex flex-col gap-8">
<!-- Progress Stepper -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-center px-1">
<div class="flex flex-col items-center gap-1.5">
<span class="text-[11px] font-bold tracking-wider text-primary uppercase">Dados pessoais</span>
</div>
<div class="flex flex-col items-center gap-1.5">
<span class="text-[11px] font-bold tracking-wider text-outline uppercase">Contato</span>
</div>
<div class="flex flex-col items-center gap-1.5">
<span class="text-[11px] font-bold tracking-wider text-outline uppercase">Banco</span>
</div>
</div>
<div class="flex w-full h-1.5 gap-2 px-1">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
</div>
</section>
<!-- Main Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_12px_32px_rgba(25,28,30,0.04)]">
<div class="mb-8">
<h2 class="text-2xl font-extrabold tracking-tight text-on-surface leading-tight">Dados pessoais</h2>
<p class="text-on-surface-variant text-sm mt-2">Preencha suas informações profissionais para iniciar a análise de crédito.</p>
</div>
<form class="space-y-5">
<div class="flex flex-col gap-2">
<label class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wide px-1">Nome completo</label>
<input class="w-full h-14 px-5 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant" placeholder="Como no CRM" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wide px-1">CPF</label>
<input class="w-full h-14 px-5 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant" placeholder="000.000.000-00" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div class="flex flex-col gap-2">
<label class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wide px-1">CRM</label>
<input class="w-full h-14 px-5 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant" placeholder="123456-SP" type="text"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wide px-1">Especialidade</label>
<div class="relative">
<select class="appearance-none w-full h-14 pl-5 pr-10 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface">
<option disabled="" selected="" value="">Selecione</option>
<option>Cardiologia</option>
<option>Dermatologia</option>
<option>Pediatria</option>
<option>Clínica Médica</option>
<option>Outros</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
</div>
<div class="pt-4">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98] hover:bg-primary/90 shadow-lg shadow-primary/20" type="submit">
                        Próximo
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Trust Badge -->
<div class="flex items-center justify-center gap-2 text-outline">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-xs font-medium">Seus dados estão protegidos sob criptografia militar</span>
</div>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl z-50 rounded-t-3xl shadow-[0_-12px_32px_rgba(25,28,30,0.04)]">

<span class="material-symbols-outlined">verified_user</span>
<span class="font-inter text-[11px] font-medium tracking-tight">Security</span>
</a>
