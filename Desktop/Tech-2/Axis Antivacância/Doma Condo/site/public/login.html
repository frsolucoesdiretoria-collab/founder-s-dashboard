<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Doma Condo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Manrope:wght@300;400;500;600&amp;family=Outfit:wght@300;400;500;600;700&amp;family=DM+Sans:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#001e2f",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#f0c038",
                        "tertiary-fixed": "#cae6ff",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f0f1f3",
                        "on-secondary-fixed": "#251a00",
                        "on-secondary-container": "#76622f",
                        "on-primary-container": "#614a00",
                        "surface-container": "#edeef0",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#f0c038",
                        "primary-container": "#e8b931",
                        "on-primary-fixed": "#251a00",
                        "surface-container-highest": "#e1e2e4",
                        "outline-variant": "#d1c5ae",
                        "inverse-surface": "#2e3132",
                        "surface-container-low": "#f2f4f6",
                        "on-surface": "#191c1e",
                        "on-tertiary-fixed-variant": "#004b6f",
                        "primary": "#765b00",
                        "secondary-container": "#fbe0a0",
                        "on-surface-variant": "#4e4634",
                        "surface-dim": "#d9dadc",
                        "tertiary": "#006492",
                        "on-tertiary-container": "#005279",
                        "on-error": "#ffffff",
                        "surface": "#f8f9fb",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#dec487",
                        "tertiary-fixed-dim": "#8bceff",
                        "primary-fixed": "#ffdf94",
                        "secondary": "#705c29",
                        "secondary-fixed": "#fbe0a0",
                        "background": "#f8f9fb",
                        "on-secondary-fixed-variant": "#564514",
                        "surface-variant": "#e1e2e4",
                        "surface-bright": "#f8f9fb",
                        "on-primary-fixed-variant": "#594400",
                        "surface-container-high": "#e7e8ea",
                        "surface-tint": "#765b00",
                        "tertiary-container": "#78c7ff",
                        "outline": "#807662",
                        "on-background": "#191c1e",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Outfit", "Plus Jakarta Sans"],
                        "body": ["Manrope", "DM Sans"],
                        "label": ["Manrope", "DM Sans"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(#e8b931 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.1;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- LEFT COLUMN: AUTHENTICATION FLOW -->
<section class="w-full md:w-1/2 bg-surface-container-lowest flex flex-col p-8 md:p-16 lg:p-24 relative overflow-y-auto">
<!-- Branding Header -->
<header class="mb-12 md:mb-20">
<div class="flex flex-col">
<div class="flex items-baseline space-x-1 font-headline font-bold text-[24px] tracking-tight">
<span class="text-[#1A1A1A]">DOMA</span>
<span class="text-[#E8B931]">CONDO</span>
</div>
<span class="font-body text-[12px] text-[#6B7280] uppercase tracking-widest mt-1">Assessoria e Consultoria</span>
</div>
</header>
<!-- Login Form Container -->
<div class="max-w-md w-full mx-auto my-auto">
<div class="mb-10 text-center md:text-left">
<h1 class="font-headline font-semibold text-[22px] text-on-surface mb-2">Bem-vindo de volta</h1>
<p class="font-body text-[14px] text-[#6B7280]">Faça login para continuar</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider ml-1" for="email">E-mail</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm transition-all placeholder:text-outline" id="email" placeholder="jessica@domacondo.com.br" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider ml-1" for="password">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" type="checkbox"/>
<span class="text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar de mim</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[42px] bg-[#E8B931] text-[#1A1A1A] font-body font-medium rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center text-sm" type="submit">
                        Entrar
                    </button>
<!-- Forgot Password -->
<div class="text-center pt-4">
<a class="text-sm font-medium text-[#E8B931] hover:underline transition-all decoration-2 underline-offset-4" href="#">
                            Esqueci minha senha
                        </a>
</div>
</form>
</div>
<!-- Footer for Left Column -->
<footer class="mt-auto pt-12 flex justify-center md:justify-start">
<p class="text-[10px] text-outline-variant uppercase tracking-[0.2em] font-medium">© 2024 Doma Condo. Todos os direitos reservados.</p>
</footer>
</section>
<!-- RIGHT COLUMN: BRAND EXPERIENCE -->
<section class="hidden md:flex md:w-1/2 bg-[#1A1A1A] relative items-center justify-center p-12 overflow-hidden">
<!-- Visual Accents -->
<div class="absolute inset-0 bg-pattern"></div>
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-primary-container/5 rounded-full blur-[120px]"></div>
<!-- Central Branding Content -->
<div class="relative z-10 flex flex-col items-center text-center max-w-lg">
<div class="mb-16">
<div class="flex items-baseline space-x-2 font-headline font-bold text-[48px] tracking-tight mb-2">
<span class="text-white">DOMA</span>
<span class="text-[#E8B931]">CONDO</span>
</div>
<div class="h-px w-12 bg-[#E8B931] mx-auto mb-4"></div>
<p class="font-body text-[14px] text-[#9CA3AF] uppercase tracking-[0.3em]">Assessoria e Consultoria</p>
</div>
<blockquote class="mb-12">
<p class="font-headline font-light italic text-[20px] text-white leading-relaxed">
                        "Gestão inteligente para quem move condomínios."
                    </p>
</blockquote>
<!-- Abstract Visual Representative of Condo Architecture -->
<div class="w-full aspect-video rounded-xl overflow-hidden shadow-2xl relative">
<img alt="Arquitetura Moderna" class="w-full h-full object-cover grayscale contrast-125 opacity-40" data-alt="Modern architectural building facade with clean lines and glass windows reflecting a clear blue sky, high-end professional aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBney8kdteuSF7flInfEd-ShlKoPw0aMoAivG5a7HXadHmbZnhPDADw-qCi093WkXSbQ27UCMGM-gzEH-KJ5rD0S1BUYWZZPcixPjVQphjzkCOANQMd2pt6F3RBVOdcC_lOPjt6y9-lpONhIQ8yH2fttqzgsSqqaGDhsET1-kkL03an-1yMyJ-pj73hAUVl1TqOirwDrpbbGsnUbpfKlYZHaNkb7-JJjK9_y-du5rQswZStg18KqbPv7QQ7u2krez0AgWVGdI1jjEjV"/>
<div class="absolute inset-0 bg-gradient-to-t from-[#1A1A1A] via-transparent to-transparent opacity-80"></div>
</div>
</div>
<!-- Subliminal Branding Text -->
<div class="absolute bottom-12 right-12 select-none pointer-events-none">
<span class="text-[120px] font-headline font-bold text-white/[0.02] leading-none">DOMA</span>
</div>
</section>
</main>
</body></html>
